# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render prompts for every `sync: false` value.
services:
  - type: web
    name: patm
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Generate once with `npx web-push generate-vapid-keys` and never rotate:
      # Render's disk is wiped on every deploy, so the data/vapid.json fallback
      # would mint new keys each time and kill every saved push subscription.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
